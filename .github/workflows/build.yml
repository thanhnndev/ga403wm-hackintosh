name: build-kexts

# Build only. This workflow never creates a GitHub release and never uploads release assets: on every trigger, tags
# included, the results are artifacts of the workflow run. The maintainer downloads them, checks them and creates the
# release by hand (text: .github/release-notes/v2.md for the macOS 26 Tahoe bundle; .github/release-body.md is the
# macOS 15 text of v1 / kext-v1.1).
#
# Built here: the kexts ItlXhciKick, ItlDiag, StrixS0ix, StrixSbxMap and the TapGuard app, ad-hoc signed; the earlier
# boot-display research kexts (StrixMetalGate, StrixGOP, StrixAccel, StrixHeadroom) are compiled as a check and are
# not packaged. StrixSbxMap is compiled as a check too: a usable one carries the code hashes of the installer's own
# plugin files (scripts/macos-install-strixsbxmap.sh builds and pins it on the target).
# Not built here, they have their own CI and releases: Wi-Fi and Bluetooth (https://github.com/thanhnndev/mt7925-macos)
# and ROG Control, AsusWmi, AmdCppc (https://github.com/thanhnndev/rog-control-macos).
# The reference EFI (efi/) is not packaged: it still describes the macOS 15 configuration.
# A tag "v*" additionally builds OpenCore with the Zen 5 patch (opencore.yml), also as a run artifact.
on:
  push:
    branches: [main, "release/**"]
    tags: ["v*", "kext-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  efi-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: efi/OC/config.plist carries placeholders only
        run: python3 scripts/check-efi-privacy.py efi/OC/config.plist

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build kexts
        run: bash scripts/build.sh

      - name: Build StrixS0ix (Tahoe setup, explicit target)
        run: bash scripts/build.sh StrixS0ix

      - name: Build StrixSbxMap (Tahoe setup, Lilu plugin, explicit target; compile check, not packaged)
        run: bash scripts/build.sh StrixSbxMap

      - name: Build StrixMetalGate (superseded research kext, compile check)
        run: bash scripts/build.sh StrixMetalGate

      - name: Build StrixGOP (superseded research kext, compile check)
        run: bash scripts/build.sh StrixGOP

      - name: Build StrixAccel (superseded research kext, compile check)
        run: bash scripts/build.sh StrixAccel

      - name: Build StrixHeadroom (superseded research kext, Lilu plugin, compile check)
        run: bash scripts/build.sh StrixHeadroom

      - name: Build the app
        run: |
          bash scripts/build-tapguard.sh
          file build/TapGuard.app/Contents/MacOS/TapGuard

      - name: Package
        run: |
          mkdir -p dist
          for k in ItlXhciKick ItlDiag StrixS0ix; do
            ditto -c -k --keepParent "build/$k.kext" "dist/$k.kext.zip"
          done
          ditto -c -k --keepParent build/TapGuard.app dist/TapGuard.app.zip
          cp LICENSE dist/LICENSE
          (cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: kexts
          path: dist/*

  # Build only: the patched OpenCore stays an artifact of this run. No job in this file has contents: write.
  opencore:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/opencore.yml
