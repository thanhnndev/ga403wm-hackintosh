name: build-kexts

# Builds itlmt7925, ItlXhciKick and ItlDiag with empty Wi-Fi credentials (credentials are injected locally, never in CI).
# A tag "v*" additionally publishes the zipped kexts as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  efi-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: efi/OC/config.plist carries placeholders only
        run: python3 scripts/check-efi-privacy.py efi/OC/config.plist

  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Host crypto test (WPA2 PMK / PTK / MIC / key unwrap)
        run: |
          cd test
          clang++ -std=c++17 -I../kexts/itlmt7925 wpa_test.cpp ../kexts/itlmt7925/itl_wpa.cpp -o wpa_test
          ./wpa_test

      - name: Host capability test (HT / VHT parsing, channel width, advertised elements)
        run: |
          cd test
          clang++ -std=c++17 -Wall -I../kexts/itlmt7925 caps_test.cpp ../kexts/itlmt7925/itl_caps.cpp -o caps_test
          ./caps_test

      - name: Host Block Ack test (reorder buffer, ADDBA / DELBA / BAR frames)
        run: |
          cd test
          clang++ -std=c++17 -Wall -I../kexts/itlmt7925 ba_test.cpp ../kexts/itlmt7925/itl_ba.cpp -o ba_test
          ./ba_test

      - name: Build kexts
        run: bash scripts/build.sh

      - name: Build StrixMetalGate (ESP-injected, explicit target)
        run: bash scripts/build.sh StrixMetalGate

      - name: Package
        run: |
          mkdir -p dist
          for k in itlmt7925 ItlXhciKick ItlDiag; do
            ditto -c -k --keepParent "build/$k.kext" "dist/$k.kext.zip"
          done
          cp fw/LICENCE.mediatek dist/LICENCE.mediatek
          cp LICENSE dist/LICENSE
          (cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: kexts
          path: |
            build/*.kext
            dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kexts
          path: artifact
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            --title "$GITHUB_REF_NAME" artifact/dist/*
